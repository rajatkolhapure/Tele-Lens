publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^0.11.8
  camera: ^0.11.0+2
  wakelock_plus: ^1.2.5
  device_info_plus: ^10.1.2
  battery_plus: ^6.0.2
  mobile_scanner: ^5.2.3

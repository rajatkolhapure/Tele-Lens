include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Treat deprecation warnings as info so future SDK upgrades don't
    # immediately break CI — update call-sites incrementally.
    deprecated_member_use: info
    deprecated_member_use_from_same_package: info
    # use_build_context_synchronously: context is always guarded with mounted
    # checks in this codebase; suppress to avoid false positives in closures.
    use_build_context_synchronously: ignore

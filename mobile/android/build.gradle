allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Ensure all Android library plugins compile against SDK 36
// Using plugins.withId avoids invalid afterEvaluate lifecycle calls
subprojects {
    project.plugins.withId("com.android.library") {
        project.android {
            compileSdk = 36
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

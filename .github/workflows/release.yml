name: Release — Build & Publish

# ─── Triggers ────────────────────────────────────────────────────────────────
# 1. Automatically when a version tag is pushed  (e.g.  git tag v1.0.0 && git push --tags)
# 2. Manually via Actions > "Run workflow" for test/pre-release builds
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: 'true'
        type: boolean

# ─── Permissions ─────────────────────────────────────────────────────────────
permissions:
  contents: write   # Required to create GitHub Releases and upload assets

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 — Windows Installer  (TeleLens-Setup.exe)
  # ═══════════════════════════════════════════════════════════════════════════
  build-windows:
    name: 🪟 Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: receiver/requirements.txt

      - name: Install Python dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r receiver/requirements.txt
          pip install -e receiver
          pip install pyinstaller

      # ── Verify installer icon and driver binaries ────────────────────────
      - name: Verify installer assets and driver binaries
        shell: pwsh
        run: |
          if (-not (Test-Path "installer\assets\telelens.ico")) {
            throw "Missing installer icon: installer\assets\telelens.ico"
          }
          $dll64 = "installer\drivers\obs-virtualcam\obs-virtualcam-startup.dll"
          $dll32 = "installer\drivers\obs-virtualcam\obs-virtualcam-startup-32bit.dll"
          if (-not (Test-Path $dll64) -or (Get-Item $dll64).Length -eq 0) {
            throw "Missing or 0-byte 64-bit driver binary: $dll64"
          }
          if (-not (Test-Path $dll32) -or (Get-Item $dll32).Length -eq 0) {
            throw "Missing or 0-byte 32-bit driver binary: $dll32"
          }
          Write-Host "Driver binaries verified successfully."

      - name: Build one-folder PyInstaller bundle
        working-directory: receiver
        run: |
          pyinstaller telelens.spec --clean --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile Inno Setup installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\telelens_installer.iss

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-installer/TeleLens-Setup.exe
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 — Android Universal APK  (TeleLens-Android-Universal.apk)
  # ═══════════════════════════════════════════════════════════════════════════
  build-android:
    name: 🤖 Build Android Universal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (required by Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (stable channel)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: mobile
        run: |
          flutter analyze --no-fatal-warnings 2>&1 | tee /tmp/flutter_analyze.log || true
          if grep -E "^  error •" /tmp/flutter_analyze.log; then
            echo "ERRORS FOUND — see above"
            exit 1
          fi

      - name: Run Flutter unit tests
        if: ${{ hashFiles('mobile/test/**/*_test.dart') != '' }}
        working-directory: mobile
        run: flutter test

      - name: Build universal release APK
        working-directory: mobile
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm,android-arm64,android-x64

      - name: Rename APK with version tag
        run: |
          TAG="${{ github.ref_name }}"
          # Fallback for manual dispatch (no tag)
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then TAG="dev"; fi
          cp mobile/build/app/outputs/flutter-apk/app-release.apk \
             TeleLens-Android-Universal-${TAG}.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: TeleLens-Android-Universal-*.apk
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3 — Create GitHub Release  (runs after both builds succeed)
  # ═══════════════════════════════════════════════════════════════════════════
  create-release:
    name: 🚀 Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    # Only create a real release on tagged pushes; manual dispatch gets a pre-release
    if: always() && (needs.build-windows.result == 'success' || needs.build-android.result == 'success')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Determine version & pre-release flag
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          IS_PRERELEASE="${{ github.event.inputs.prerelease || 'false' }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="dev-$(date +%Y%m%d-%H%M)"
            IS_PRERELEASE="true"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Determine APK filename
        id: apk_name
        run: |
          APK=$(ls release-artifacts/android-apk/TeleLens-Android-Universal-*.apk 2>/dev/null | head -n1 | xargs basename || echo "TeleLens-Android-Universal.apk")
          echo "apk_file=$APK" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and attach binaries
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "TeleLens ${{ steps.meta.outputs.tag }}"
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## TeleLens ${{ steps.meta.outputs.tag }}

            ### ⚡ Fast CDN Downloads (Cloudflare — global, no throttling)
            | File | Link |
            |------|------|
            | 🖥️ Windows Installer | [TeleLens-Setup.exe](https://cdn.telelens.app/${{ steps.meta.outputs.tag }}/TeleLens-Setup.exe) |
            | 📱 Android APK | [TeleLens-Android-Universal.apk](https://cdn.telelens.app/${{ steps.meta.outputs.tag }}/${{ steps.apk_name.outputs.apk_file }}) |

            > These links are served via **Cloudflare R2** — full speed worldwide, no GitHub rate limits.

            ---

            ### 🖥️ Windows Installation (Recommended)
            1. Download **`TeleLens-Setup.exe`** above and run it.
            2. The installer registers the virtual camera driver automatically.
            3. A desktop shortcut is created — double-click to launch.

            ### 📱 Android Installation
            1. Download **`TeleLens-Android-Universal.apk`** above.
            2. On your phone: **Settings → Apps → Install unknown apps** → allow your browser.
            3. Tap the downloaded APK to install.
            4. Open TeleLens → your laptop appears instantly → tap **Connect**.

            ### ⚡ First-Time Setup (30 seconds)
            1. Run TeleLens on your laptop.
            2. Open TeleLens on your phone — it auto-discovers the laptop.
            3. Tap the glowing laptop card, click **Accept** on the laptop.
            4. Your phone is now a 4K webcam! Open Zoom / Teams / Meet and select **TeleLens Virtual Camera**.

            > **Tip:** For wired USB (zero-jitter) connection, plug in your phone and tap ⚡ USB Connect in the app.
          files: |
            release-artifacts/windows-installer/TeleLens-Setup.exe
            release-artifacts/android-apk/TeleLens-Android-Universal-*.apk

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4 — Mirror to Cloudflare R2  (fast CDN for global downloads)
  # ═══════════════════════════════════════════════════════════════════════════
  mirror-to-r2:
    name: ☁️ Mirror to Cloudflare R2 CDN
    runs-on: ubuntu-latest
    needs: [create-release]
    # Skip if secrets are not configured (e.g. forks or first-time setup)
    if: |
      always() &&
      needs.create-release.result == 'success' &&
      vars.CF_R2_BUCKET != '' &&
      secrets.CF_ACCOUNT_ID != '' &&
      secrets.CF_R2_ACCESS_KEY_ID != '' &&
      secrets.CF_R2_SECRET_ACCESS_KEY != ''

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Determine version tag
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Re-derive the dev tag (same logic as create-release job)
            TAG="dev-$(date +%Y%m%d-%H%M)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Install AWS CLI (used for R2 S3-compatible API)
        run: |
          pip install awscli --quiet

      - name: Upload Windows installer to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.CF_R2_BUCKET }}
        run: |
          if ls release-artifacts/windows-installer/TeleLens-Setup.exe 2>/dev/null; then
            aws s3 cp \
              release-artifacts/windows-installer/TeleLens-Setup.exe \
              "s3://${BUCKET}/${{ steps.meta.outputs.tag }}/TeleLens-Setup.exe" \
              --endpoint-url "$R2_ENDPOINT" \
              --no-progress
            echo "✅ Windows installer uploaded to R2"
          else
            echo "⚠️  Windows installer artifact not found — skipping"
          fi

      - name: Upload Android APK to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.CF_R2_BUCKET }}
        run: |
          APK=$(ls release-artifacts/android-apk/TeleLens-Android-Universal-*.apk 2>/dev/null | head -n1)
          if [ -n "$APK" ]; then
            BASENAME=$(basename "$APK")
            aws s3 cp \
              "$APK" \
              "s3://${BUCKET}/${{ steps.meta.outputs.tag }}/${BASENAME}" \
              --endpoint-url "$R2_ENDPOINT" \
              --no-progress
            echo "✅ Android APK uploaded to R2: ${BASENAME}"
          else
            echo "⚠️  Android APK artifact not found — skipping"
          fi

      - name: Upload latest/ aliases (always point to newest release)
        if: ${{ !startsWith(steps.meta.outputs.tag, 'dev-') }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.CF_R2_BUCKET }}
        run: |
          # Copy versioned files to a stable /latest/ prefix
          aws s3 cp \
            "s3://${BUCKET}/${{ steps.meta.outputs.tag }}/TeleLens-Setup.exe" \
            "s3://${BUCKET}/latest/TeleLens-Setup.exe" \
            --endpoint-url "$R2_ENDPOINT" \
            --no-progress || true

          APK=$(ls release-artifacts/android-apk/TeleLens-Android-Universal-*.apk 2>/dev/null | head -n1)
          if [ -n "$APK" ]; then
            BASENAME=$(basename "$APK")
            aws s3 cp \
              "s3://${BUCKET}/${{ steps.meta.outputs.tag }}/${BASENAME}" \
              "s3://${BUCKET}/latest/TeleLens-Android-Universal.apk" \
              --endpoint-url "$R2_ENDPOINT" \
              --no-progress || true
          fi
          echo "✅ /latest/ aliases updated"

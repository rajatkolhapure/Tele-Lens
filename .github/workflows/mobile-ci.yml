name: Mobile CI

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/**'

jobs:
  analyze-and-test:
    name: Analyze & Test Flutter App
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: mobile
        run: |
          flutter analyze --no-fatal-warnings 2>&1 | tee /tmp/flutter_analyze.log || true
          echo "--- ANALYZE OUTPUT ---"
          cat /tmp/flutter_analyze.log
          # Fail only on actual errors (not warnings/infos)
          if grep -E "^  error •" /tmp/flutter_analyze.log; then
            echo "ERRORS FOUND — see above"
            exit 1
          fi

      - name: Run unit tests
        if: ${{ hashFiles('mobile/test/**/*_test.dart') != '' }}
        working-directory: mobile
        run: flutter test

      - name: Check formatting
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed . || dart format .

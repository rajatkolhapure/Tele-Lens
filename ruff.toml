line-length = 120
target-version = "py310"

[lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # line too long — not enforced
    "E402",   # module level import not at top — intentional for path setup in frozen bundles
    "F401",   # imported but unused inside try/except blocks for optional PyQt6/aiortc deps
]
